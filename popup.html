<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      width: 420px;
      min-height: 0;
      padding: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      color: #eaf2ff;
      background: linear-gradient(180deg, #4a7bb5 0%, #3a6ba5 60%, #2f5a92 100%);
    }

    h3 {
      margin: 0 0 2px 0;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
      letter-spacing: 0.3px;
    }
    .subtitle {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #d4e5ff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
    }

    /* =========================================================
       Tracking status chip — compact, sits below the title
       ========================================================= */
    #trackingState {
      display: inline-block;
      font-size: 10px;
      line-height: 1.2;
      padding: 2px 8px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid #2d5080;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 2px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0 0 10px 0;
    }
    .state-tracking {
      background: linear-gradient(180deg, #d6f0d6 0%, #a8dcac 100%);
      color: #1a5a1a; border-color: #6fa872;
    }
    .state-break {
      background: linear-gradient(180deg, #ffe6c8 0%, #ffc98a 100%);
      color: #7a4a00; border-color: #c9964a;
    }
    .state-idle {
      background: linear-gradient(180deg, #e8eef5 0%, #c8d4e0 100%);
      color: #40505f; border-color: #8a98a8;
    }
    .state-unknown {
      background: linear-gradient(180deg, #e0e6ec 0%, #c0c8d0 100%);
      color: #606870; border-color: #8a98a8;
    }

    /* =========================================================
       Action row — WAVE + PRS side by side
       ========================================================= */
    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .action-row button {
      flex: 1;
      min-width: 0;
    }

    .panel {
      background: linear-gradient(180deg, #6f9dd0 0%, #5a8bc0 50%, #4a7bb5 100%);
      border: 1px solid #2d5080;
      border-top-color: #a8c8e8;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 2px 4px rgba(0, 0, 0, 0.2);
    }
    .panel:last-of-type { margin-bottom: 4px; }

    button.blue {
      padding: 7px 14px;
      background: linear-gradient(180deg, #8fb8e0 0%, #5a8bc0 50%, #3f74ae 100%);
      color: #ffffff;
      border: 1px solid #2d5080;
      border-top-color: #b8d4ef;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -2px 3px rgba(0, 0, 0, 0.15),
        0 2px 3px rgba(0, 0, 0, 0.25);
      transition: all 0.1s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button.blue:hover {
      background: linear-gradient(180deg, #a0c5e8 0%, #6b9bd0 50%, #4a82bd 100%);
    }
    button.blue:active {
      background: linear-gradient(180deg, #3f74ae 0%, #5a8bc0 50%, #8fb8e0 100%);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.3),
        inset 0 -1px 0 rgba(255, 255, 255, 0.2);
      transform: translateY(1px);
    }
    button.green {
      background: linear-gradient(180deg, #a4dfa4 0%, #6fb96f 50%, #4a964a 100%);
      border-color: #2d6e2d;
      border-top-color: #c8eec8;
    }
    button.green:hover {
      background: linear-gradient(180deg, #b8ebb8 0%, #7fc97f 50%, #55a055 100%);
    }
    button.green:active {
      background: linear-gradient(180deg, #4a964a 0%, #6fb96f 50%, #a4dfa4 100%);
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #eaf2ff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 0 0 6px 2px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    }

    .value-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 10px;
      border: 1px solid #2d5080;
      border-top-color: #a8c8e8;
      border-radius: 8px;
      background: linear-gradient(180deg, #e8f0fa 0%, #d4e2f2 100%);
      margin-bottom: 4px;
      min-height: 30px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 2px rgba(0, 0, 0, 0.05);
    }
    .value-row:last-child { margin-bottom: 0; }
    .value-row .label {
      font-size: 11px;
      font-weight: 700;
      color: #4a6a8a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .value-row .value {
      color: #1a3050;
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: right;
    }
    .value-row .value.empty {
      color: #8a9aac;
      font-style: italic;
      font-weight: 400;
    }

    .time-row {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
    }
    .time-row:last-child { margin-bottom: 0; }
    .time-row .form-group { flex: 1; }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #eaf2ff;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    }
    .form-group input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #2d5080;
      border-top-color: #1d3d6a;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      color: #eaf2ff;
      background: linear-gradient(180deg, #2d5080 0%, #3a6ba5 100%);
      box-shadow:
        inset 0 2px 3px rgba(0, 0, 0, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1),
        0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.15s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #a8d4ff;
      box-shadow:
        inset 0 2px 3px rgba(0, 0, 0, 0.35),
        0 0 0 3px rgba(168, 212, 255, 0.4);
    }
    .form-group input::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(1.4);
      cursor: pointer;
    }

    #saveIndicator {
      height: 14px;
      font-size: 11px;
      color: #c8eec8;
      text-align: right;
      margin: 2px 2px 0 0;
      opacity: 0;
      transition: opacity 0.2s ease;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    }
    #saveIndicator.show { opacity: 1; }
  </style>
</head>
<body>
  <h3>⚡ Productivity Assistant</h3>
  <p class="subtitle">PRS + WAVE timer management</p>

  <!-- Tracking status chip — compact, sits right below the title -->
  <div id="trackingState" class="state-unknown">⏳ Checking working status…</div>

  <!-- Action buttons: Launch WAVE + Open PRS Login on one line -->
  <div class="action-row">
    <button id="launchWave" class="blue">🚀 Launch WAVE</button>
    <button id="openPrsBtn" class="blue">🔗 Open PRS Login</button>
  </div>

  <!-- Current WAVE selections -->
  <div class="panel">
    <div class="section-title">Current WAVE Selections</div>
    <div class="value-row">
      <span class="label">Project</span>
      <span class="value empty" id="projectNameValue">—</span>
    </div>
    <div class="value-row">
      <span class="label">Task</span>
      <span class="value empty" id="taskNameValue">—</span>
    </div>
    <div class="value-row">
      <span class="label">Subtask</span>
      <span class="value empty" id="subtaskNameValue">—</span>
    </div>
  </div>

  <!-- Shift schedule -->
  <div class="panel">
    <div class="section-title">Shift</div>
    <div class="time-row">
      <div class="form-group">
        <label for="shiftStart">Shift Start</label>
        <input type="time" id="shiftStart" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="shiftStop">Shift Stop</label>
        <input type="time" id="shiftStop" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- Break schedule -->
  <div class="panel">
    <div class="section-title">Breaks</div>
    <div class="time-row">
      <div class="form-group">
        <label for="firstBreakStart">First Break Start</label>
        <input type="time" id="firstBreakStart" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="firstBreakStop">First Break Stop</label>
        <input type="time" id="firstBreakStop" autocomplete="off">
      </div>
    </div>
    <div class="time-row">
      <div class="form-group">
        <label for="secondBreakStart">Second Break Start</label>
        <input type="time" id="secondBreakStart" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="secondBreakStop">Second Break Stop</label>
        <input type="time" id="secondBreakStop" autocomplete="off">
      </div>
    </div>
  </div>

  <div id="saveIndicator">✅ Saved</div>

  <script src="popup.js"></script>
</body>
</html>
